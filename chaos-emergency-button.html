<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>CHAOS EMERGENCY BUTTON</title>
  <style>
    body { background:#0f0f1a; color:#eaeaea; font-family:system-ui; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; margin:0; }
    h1 { color:#e94560; }
    button { font-size:2rem; padding:1.5rem 3rem; background:#e94560; color:white; border:none; border-radius:12px; cursor:pointer; }
    button:hover { background:#ff6b81; }
    #out { margin-top:2rem; font-size:1.2rem; color:#fbbf24; min-height:2rem; text-align:center; max-width:400px; }
  </style>
</head>
<body>
  <h1>CHAOS EMERGENCY BUTTON</h1>
  <p>Press only in case of excessive order</p>
  <button onclick="go()">DEPLOY CHAOS</button>
  <div id="out"></div>
  <script>
    const lines = [
      "Scooters released.",
      "MelonKing has entered the chat.",
      "All homework has been reclassified as cruel.",
      "A random node somewhere just got infected.",
      "Boredom levels dropping...",
      "You are now slightly more chaotic.",
      "Long live the scooters."
    ];
    function go() {
      document.getElementById('out').textContent = lines[Math.floor(Math.random()*lines.length)];
    }
  </script>
</body>
</html>
